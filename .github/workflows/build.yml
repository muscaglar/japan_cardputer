name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Unit tests on the host
        run: pio test -e native

      - name: Build firmware
        run: pio run -e cardputer

      - name: Merge into one image
        run: |
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32s3 merge_bin \
            -o japan_cardputer.bin --flash_mode keep --flash_freq keep --flash_size keep \
            0x0 .pio/build/cardputer/bootloader.bin \
            0x8000 .pio/build/cardputer/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/cardputer/firmware.bin
          ls -l japan_cardputer.bin .pio/build/cardputer/firmware.bin

      - name: Concept screens render without overflow
        run: python tools/concept_screens.py build/concepts

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            japan_cardputer.bin
            .pio/build/cardputer/firmware.bin

      - name: Publish as the latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest japan_cardputer.bin .pio/build/cardputer/firmware.bin \
            --prerelease --title "Latest build" \
            --notes "Built from ${GITHUB_SHA}. japan_cardputer.bin is the whole image, to be written at offset 0x0. firmware.bin is the app alone, for installing through a launcher." \
            --target "${GITHUB_SHA}"
