; Cardputer Japanese travel companion
; One firmware for the Cardputer, Cardputer v1.1 and Cardputer ADV: the M5 libraries detect the
; board when the device starts.
;
; Versions are pinned on purpose. The keyboard API differs between M5Cardputer releases, and a
; silent change in the weeks before a trip is the last thing wanted.

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30

; Host build for unit tests of the pure C++ parts (no hardware needed)
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_compat_mode = off
